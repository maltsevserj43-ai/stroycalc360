name: Agent Runner
on:
  workflow_call:
    inputs:
      agent_id:
        type: string
        required: true

jobs:
  run:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - run: pip install aider-chat pyyaml httpx
        
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
        
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5-coder:1.5b
          
      - name: Configure git
        run: |
          git config user.name "agent-${{ inputs.agent_id }}"
          git config user.email "agent@stroycalc.local"
          
      - name: Run agent
        env:
          OLLAMA_API_BASE: "http://127.0.0.1:11434"
          OLLAMA_MODEL: "qwen2.5-coder:1.5b"
          OPENAI_API_KEY: "sk-dummy"
        run: python scripts/run_agent.py ${{ inputs.agent_id }}
        
      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH=$(python -c "import yaml;print(yaml.safe_load(open('agents/config.yaml'))['agents']['${{ inputs.agent_id }}']['branch'])")
          git checkout -B $BRANCH
          git push -f origin $BRANCH
          gh pr create --base main --head $BRANCH --title "[${{ inputs.agent_id }}] auto PR" --body "Auto-generated by Ollama" --label auto || true
